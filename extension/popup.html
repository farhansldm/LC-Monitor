<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LC Monitor</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 300px;
      padding: 16px;
      margin: 0;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #0f172a;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover {
      background-color: #1e293b;
    }
    #error-msg {
      color: #dc2626;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    #status-container {
      display: none;
      text-align: center;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 9999px;
      background-color: #dcfce7;
      color: #166534;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div id="login-container">
    <h2>LC Monitor Login</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="employee@company.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button id="login-btn">Login</button>
    <div id="error-msg"></div>
  </div>

  <div id="status-container">
    <h2>LC Monitor Active</h2>
    <div class="status-badge">● Monitoring enabled</div>
    <p style="font-size: 13px; color: #666;">You are logged in as:<br><strong id="user-email"></strong></p>
    <button id="logout-btn" style="background-color: #ef4444;">Logout</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
